<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>BM Flow — หน้างาน</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
/* ═══════════════════════════════════════════════════════════
   BM Flow Handheld (PWA) — หน้างานสำหรับมือถือ / แท็บเล็ต / เครื่องแฮนด์เฮลด์สแกนเนอร์ (2026-10-17)
   หลักการ UX: ปุ่ม/แถวที่แตะสูง ≥ 52px · ตัวอักษรช่องกรอก 17px (กัน iOS ซูมเอง) · งานหลักอยู่ปุ่มใหญ่หน้าแรก ·
   ปุ่มบันทึกติดล่างจอ (ใช้นิ้วโป้งเดียว) · ช่องสแกนโฟกัสอัตโนมัติ รับเครื่องสแกนแบบคีย์บอร์ด (พิมพ์รหัสแล้ว Enter) + ปุ่มกล้อง ·
   แท็บเล็ต ≥ 900px: ปุ่มหน้าแรกเป็นตาราง 3 คอลัมน์ และหน้าตรวจสต็อกแบ่ง 2 ฝั่ง (รายการ | รายละเอียด)
   ═══════════════════════════════════════════════════════════ */
:root { --blue: #1e3a8a; --blue2: #2563eb; --bg: #eef2f7; --card: #fff; --ink: #0f172a; --mute: #64748b; --line: #e2e8f0;
  --ok: #16a34a; --warn: #d97706; --bad: #dc2626; --r: 16px; --tap: 54px; --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { font-family: 'Sarabun', system-ui, sans-serif; font-size: 17px; color: var(--ink); background: var(--bg); overscroll-behavior-y: none; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
/* ── โครง ── */
#app { display: flex; flex-direction: column; height: 100%; }
.topbar { flex: none; display: flex; align-items: center; gap: 8px; padding: calc(8px + var(--safe-t)) 12px 8px; background: linear-gradient(135deg, #1e3a8a, #2563eb); color: #fff; }
.topbar h1 { flex: 1; min-width: 0; margin: 0; font-size: 1.1rem; font-weight: 700; line-height: 1.15; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }   /* ชื่อหน้ายาว (เช่น "รับจากโอนย้ายคลังใหญ่") ขึ้นได้ 2 บรรทัดเมื่อมีโลโก้ในเฮดเดอร์ */
/* โลโก้ Blooming ในเฮดเดอร์ทุกหน้า (ผู้ใช้ขอ 2026-10-17) — วางในชิปขาวเพราะโลโก้เป็นตัวหนังสือสีเข้ม อ่านไม่ออกบนพื้นน้ำเงินของเฮดเดอร์; แตะ = กลับหน้าแรก */
.logo-chip { flex: none; display: inline-flex; align-items: center; height: 44px; padding: 4px 9px; background: #fff; border-radius: 12px; cursor: pointer; }
.logo-chip img { height: 34px; width: auto; display: block; }
.icon-btn { width: 46px; height: 46px; border: 0; border-radius: 12px; background: rgba(255,255,255,.16); color: #fff; font-size: 1.15rem; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.icon-btn:active { background: rgba(255,255,255,.3); }
.offline { flex: none; background: var(--bad); color: #fff; text-align: center; padding: 6px 10px; font-weight: 600; font-size: .9rem; }
main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 14px 28px; }
.actionbar { flex: none; display: flex; gap: 10px; padding: 10px 14px calc(10px + var(--safe-b)); background: #fff; border-top: 1px solid var(--line); box-shadow: 0 -4px 14px rgba(15,23,42,.06); }
.actionbar:empty { display: none; }
/* ── ปุ่ม ── */
.btn { min-height: var(--tap); padding: 0 20px; border: 0; border-radius: 14px; font-weight: 700; font-size: 1.05rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:active { transform: scale(.98); filter: brightness(.95); }
.btn:disabled { opacity: .5; }
.btn-primary { background: var(--blue2); color: #fff; flex: 1; }
.btn-ok { background: var(--ok); color: #fff; flex: 1; }
.btn-ghost { background: #e8eef9; color: var(--blue); }
.btn-danger { background: #fee2e2; color: var(--bad); }
.btn-sm { min-height: 44px; padding: 0 14px; font-size: .95rem; border-radius: 12px; }
/* ── การ์ด / รายการ ── */
.card { background: var(--card); border-radius: var(--r); padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(15,23,42,.07); }
.card h3 { margin: 0 0 8px; font-size: 1.02rem; color: var(--blue); }
.row-item { display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 10px 14px; background: var(--card); border-radius: var(--r); margin-bottom: 10px; box-shadow: 0 1px 3px rgba(15,23,42,.07); cursor: pointer; }
.row-item:active { background: #f1f5ff; }
.row-item .grow { flex: 1; min-width: 0; }
.row-item .t { font-weight: 700; line-height: 1.25; }
.row-item .s { color: var(--mute); font-size: .86rem; margin-top: 2px; }
.qty-big { text-align: right; font-weight: 700; font-size: 1.3rem; color: var(--blue); line-height: 1.1; white-space: nowrap; }
.qty-big small { display: block; font-size: .78rem; color: var(--mute); font-weight: 400; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .78rem; font-weight: 700; background: #e2e8f0; color: #334155; margin-right: 4px; }
.pill.ok { background: #dcfce7; color: #166534; } .pill.warn { background: #fef3c7; color: #92400e; } .pill.bad { background: #fee2e2; color: #991b1b; } .pill.info { background: #dbeafe; color: #1e40af; }
.muted { color: var(--mute); } .small { font-size: .86rem; } .right { text-align: right; } .bold { font-weight: 700; }
.empty { text-align: center; color: var(--mute); padding: 36px 10px; }
/* ── ฟอร์ม ── */
.fld { margin-bottom: 12px; }
.fld > label { display: block; font-weight: 600; font-size: .92rem; color: #334155; margin-bottom: 4px; }
.fld .req { color: var(--bad); }
input.in, select.in, textarea.in { width: 100%; min-height: var(--tap); padding: 10px 14px; border: 2px solid var(--line); border-radius: 12px; background: #fff; font-size: 17px; outline: none; }
input.in:focus, select.in:focus, textarea.in:focus { border-color: var(--blue2); }
input.in.bad { border-color: var(--bad); background: #fff5f5; }
.in-group { display: flex; gap: 8px; align-items: stretch; }
.in-group .in { flex: 1; min-width: 0; }
.in-group .unit { display: flex; align-items: center; padding: 0 14px; background: #eef2f7; border-radius: 12px; font-weight: 700; color: var(--mute); white-space: nowrap; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 10px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 44px; padding: 0 16px; border: 2px solid var(--line); border-radius: 999px; background: #fff; font-weight: 600; color: #334155; cursor: pointer; }
.chip.on { background: var(--blue); border-color: var(--blue); color: #fff; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: #dfe7f3; border-radius: 14px; padding: 4px; margin-bottom: 12px; }
.seg button { min-height: 48px; border: 0; border-radius: 11px; background: transparent; font-weight: 700; color: #475569; cursor: pointer; }
.seg button.on { background: #fff; color: var(--blue); box-shadow: 0 1px 4px rgba(15,23,42,.15); }
.scanbar { display: flex; gap: 8px; margin-bottom: 12px; }
.scanbar .in { flex: 1; }
.scanbar .btn { flex: none; width: var(--tap); padding: 0; }
.err { color: var(--bad); font-size: .9rem; font-weight: 600; margin: 4px 0 8px; }
/* ── หน้าแรก ── */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { min-height: 124px; border: 0; border-radius: 20px; padding: 16px 12px; background: #fff; box-shadow: 0 2px 8px rgba(15,23,42,.1); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; font-weight: 700; font-size: 1.05rem; color: var(--ink); cursor: pointer; }
.tile:active { transform: scale(.97); }
.tile i { font-size: 2rem; color: var(--blue2); }
.tile small { font-weight: 400; color: var(--mute); font-size: .8rem; }
.tile .badge { background: var(--bad); color: #fff; border-radius: 999px; padding: 1px 9px; font-size: .78rem; }
.who { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.who .av { width: 46px; height: 46px; border-radius: 50%; background: var(--blue); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.2rem; }
/* ── แถวรายการในฟอร์ม (หลายรายการ) ── */
.line { border: 2px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 12px; background: #fff; }
.line .head { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
.line .head .grow { flex: 1; min-width: 0; }
.line.multi { border-color: #fcd34d; background: #fffbeb; }
.lotrow { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.lotrow:last-child { border-bottom: 0; }
.lotrow .grow { flex: 1; min-width: 0; }
.lotrow input.in { width: 120px; min-height: 48px; text-align: right; }
/* ── bottom sheet / สแกน ── */
#sheetWrap { position: fixed; inset: 0; z-index: 50; background: rgba(15,23,42,.5); display: flex; align-items: flex-end; justify-content: center; }
#sheet { width: 100%; max-width: 760px; max-height: 92%; background: #fff; border-radius: 22px 22px 0 0; display: flex; flex-direction: column; padding-bottom: var(--safe-b); animation: up .18s ease-out; }
@keyframes up { from { transform: translateY(40px); opacity: .5; } to { transform: none; opacity: 1; } }
#sheet .sh-head { flex: none; display: flex; align-items: center; gap: 8px; padding: 14px 16px 8px; }
#sheet .sh-head h2 { flex: 1; margin: 0; font-size: 1.12rem; color: var(--blue); }
#sheet .sh-body { flex: 1; overflow-y: auto; padding: 4px 14px 14px; -webkit-overflow-scrolling: touch; }
#sheet .sh-foot { flex: none; padding: 10px 14px; border-top: 1px solid var(--line); display: flex; gap: 10px; }
#sheet .icon-btn { background: #eef2f7; color: #334155; }
#scanner { position: fixed; inset: 0; z-index: 90; background: #000; display: flex; flex-direction: column; }
#scanner video, #scanReader { flex: 1; width: 100%; object-fit: cover; min-height: 0; }
#scanner .bar { flex: none; display: flex; align-items: center; justify-content: space-between; padding: calc(10px + var(--safe-t)) 14px 10px; color: #fff; }
#scanner .frame { position: absolute; left: 12%; right: 12%; top: 30%; height: 28%; border: 3px solid rgba(255,255,255,.85); border-radius: 18px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.35); pointer-events: none; }
#toast { position: fixed; left: 50%; bottom: calc(90px + var(--safe-b)); transform: translateX(-50%); z-index: 99; background: #0f172a; color: #fff; padding: 12px 18px; border-radius: 14px; font-weight: 600; max-width: 90%; box-shadow: 0 6px 20px rgba(0,0,0,.3); }
#toast.bad { background: var(--bad); } #toast.ok { background: var(--ok); }
/* ── เข้าสู่ระบบ ── */
#login { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 20px; background: linear-gradient(160deg, #1e3a8a, #2563eb 60%, #60a5fa); }
#login .box { width: 100%; max-width: 420px; background: #fff; border-radius: 24px; padding: 26px 22px; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
#login .box { text-align: center; } #login .fld { text-align: left; } #login .err { text-align: left; }
#login .logo { display: block; margin: 0 auto 14px; height: 76px; width: auto; max-width: 70%; object-fit: contain; }   /* โลโก้ Blooming (ไฟล์เดียวกับหน้า desktop) */
#login h1 { margin: 0 0 4px; color: var(--blue); font-size: 1.6rem; } #login p { margin: 0 0 18px; color: var(--mute); }
/* ── แท็บเล็ต / จอกว้าง ── */
@media (min-width: 700px) {
  main { padding: 18px 24px 32px; } .tiles { grid-template-columns: repeat(3, 1fr); gap: 16px; } .tile { min-height: 150px; font-size: 1.15rem; }
  .grid2.g3 { grid-template-columns: 1fr 1fr 1fr; }
}
@media (min-width: 900px) {
  .split { display: grid; grid-template-columns: minmax(340px, 42%) 1fr; gap: 18px; height: 100%; }
  .split > div { overflow-y: auto; min-height: 0; padding-right: 4px; }
  .split .pane-detail { background: #fff; border-radius: var(--r); padding: 16px; box-shadow: 0 1px 3px rgba(15,23,42,.07); }
  .formwrap { max-width: 860px; margin: 0 auto; }
}
@media (min-width: 900px) { main.has-split { overflow: hidden; } }
@media (max-width: 899px) { .pane-detail { display: none; } }
</style>
</head>
<body>

<!-- ═══ เข้าสู่ระบบ ═══ -->
<div id="login" hidden>
  <div class="box">
    <img class="logo" src="assets/logo-blooming.webp" alt="Blooming Company Limited" onerror="this.style.display='none'">
    <h1><i class="fa-solid fa-leaf"></i> BM Flow</h1>
    <p>หน้างาน — คลัง / ผลิต / จัดส่ง</p>
    <div class="fld"><label>Username หรืออีเมล</label><input class="in" id="lgUser" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"></div>
    <div class="fld"><label>รหัสผ่าน</label><input class="in" id="lgPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div class="err" id="lgErr"></div>
    <button class="btn btn-primary" style="width:100%" id="lgBtn" onclick="doLogin()">เข้าสู่ระบบ</button>
  </div>
</div>

<!-- ═══ แอพ ═══ -->
<div id="app" hidden>
  <header class="topbar">
    <button class="icon-btn" id="btnBack" onclick="goBack()" hidden aria-label="ย้อนกลับ"><i class="fa-solid fa-chevron-left"></i></button>
    <span class="logo-chip" onclick="stack=[stack[0]];render()" title="หน้าแรก"><img src="assets/logo-blooming.webp" alt="Blooming" onerror="this.parentNode.style.display='none'"></span>
    <h1 id="title">BM Flow</h1>
    <button class="icon-btn" onclick="refreshAll()" aria-label="รีเฟรชข้อมูล" title="รีเฟรชข้อมูล"><i class="fa-solid fa-rotate"></i></button>
  </header>
  <div class="offline" id="offline" hidden><i class="fa-solid fa-wifi"></i> ไม่มีสัญญาณอินเทอร์เน็ต — บันทึกไม่ได้จนกว่าจะกลับมาออนไลน์</div>
  <main id="view"></main>
  <div class="actionbar" id="actionbar"></div>
</div>

<div id="sheetWrap" hidden onclick="if(event.target===this)closeSheet()"><div id="sheet"></div></div>
<div id="scanner" hidden>
  <div class="bar"><b><i class="fa-solid fa-qrcode me-1"></i> สแกนบาร์โค้ด / QR</b><button class="icon-btn" id="scanClose" aria-label="ปิด"><i class="fa-solid fa-xmark"></i></button></div>
  <video id="scanVideo" playsinline muted></video><div id="scanReader" hidden></div><div class="frame"></div>
</div>
<div id="toast" hidden></div>

<script>
// ═══════════════════════════════════════════════════════════
// BM Flow Handheld — ใช้ Supabase โปรเจกต์/บัญชี/RLS เดียวกับแอพหลัก (index.html) ไม่มีฐานข้อมูลแยก
// เขียนข้อมูลผ่าน RPC/ตารางเดียวกับหน้า desktop ทุกประการ (rm_receive_post, rm_receive_transfer_post, rm_issue_post, misc_out_post,
// fg_withdraw_for_co) — กฎสต็อก/FEFO/FIFO/ล็อต/เลขที่เอกสารจึงตรงกัน
// ═══════════════════════════════════════════════════════════
const SB_URL = 'https://mdoqkqvgkpnsmrybzbwn.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1kb3FrcXZna3Buc21yeWJ6YnduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMzA5NzMsImV4cCI6MjEwNTkwNjk3M30.f1_XyuVccNrIkPLdz_Xuf3SX71uFAF5q69StJdOsce0';
const LOGIN_DOMAIN = '@blminternal.com';
const _sb = window.supabase.createClient(SB_URL, SB_KEY);

// ── ค่าคงที่/ตัวช่วย (ตรงกับ index.html) ──
const C_FRESH = 'วัตถุดิบ', C_DRY = 'วัตถุดิบแห้ง', C_CHEM = 'วัตถุดิบเคมี', C_PREP = 'วัตถุดิบพร้อมผลิต', C_PKG = 'แพ็คเกจจิ้ง';
const RAW_ALL = [C_FRESH, C_DRY, C_CHEM, C_PREP], RAW_GROUP = [C_FRESH, C_DRY, C_CHEM];
const catName = c => ({ [C_FRESH]: 'วัตถุดิบสด' }[c] || c || 'วัตถุดิบสด');
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const todayStr = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
function addMonths(s, m) { const [y, mo, d] = s.split('-').map(Number), t = new Date(y, mo - 1 + m, 1), last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate(); t.setDate(Math.min(d, last)); return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`; }
const fmtDate = s => s ? new Date(s + (String(s).length === 10 ? 'T00:00:00' : '')).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' }) : '—';
const daysLeft = s => s ? Math.round((new Date(s + 'T00:00:00') - new Date(todayStr() + 'T00:00:00')) / 86400000) : null;
const num = v => parseFloat(v) || 0;
const r3 = v => Math.round(v * 1000) / 1000;
// ปริมาณ: วัตถุดิบ (ชั่งน้ำหนัก) ทศนิยม 3 ตำแหน่งคงที่ · แพ็คเกจ/FG ตัดเลขท้าย 0 สูงสุด 4 ตำแหน่ง (เหมือน _qtyFmtByCat)
const fq = (n, cat) => RAW_ALL.includes(cat) ? num(n).toLocaleString(undefined, { minimumFractionDigits: 3, maximumFractionDigits: 3 }) : num(n).toLocaleString(undefined, { maximumFractionDigits: 4 });
const genId = p => { const d = new Date(); return `${p}-${String(d.getFullYear()).slice(2)}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}-${Math.random().toString(36).slice(2, 6).toUpperCase()}`; };
const lotLabel = l => l.Lot || (String(l.Lot_ID || '').startsWith('OPEN-') ? 'ยอดยกมา' : l.Lot_ID) || '—';
function toast(msg, kind) { const t = $('#toast'); t.textContent = msg; t.className = kind || ''; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, 2600); }
function vib(ms = 40) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }
function rpcErr(error, title, mig) {
  console.error(error);
  const missing = error.code === 'PGRST202' || (/Could not find the function|schema cache/i.test(error.message || '') && mig);

const q = p => p.then(r => { if (r.error) throw r.error; return r.data || []; });

const D = { rm: [], fg: [], bal: {}, rmLots: [], fgLots: [], bom: [], mos: [], cos: [], wd: {}, dlv: [], me: null };
let _loadedAt = 0;
async function loadData(force) {
  const [rm, fg, bal, rmLots, fgLots, bom, mos, cos, wd, dlv] = await Promise.all([
    q(_sb.from('rm_master').select('*').order('RM_ID')), q(_sb.from('product_master').select('*').order('FG_ID')),
    q(_sb.from('stock_balance').select('*')), q(_sb.from('stock_rm_lot').select('*').gt('Qty', 0)), q(_sb.from('stock_fg').select('*').gt('Qty', 0)),
    q(_sb.from('bom').select('*')), q(_sb.from('manufacturing_orders').select('*').eq('Status', 'วางแผน').order('PlanDate')),
    q(_sb.from('customer_orders').select('*').neq('Status', 'ส่งสำเร็จ').order('OrderDate', { ascending: false })),
    qs(_sb.from('fg_withdraw').select('Order_ID,Qty').not('Order_ID', 'is', null)), qs(_sb.from('delivery').select('*').neq('Status', 'ส่งถึงแล้ว').order('CreatedAt', { ascending: false })),
  ]);

  _loadedAt = Date.now();
}
const rmOf = id => D.rm.find(r => r.RM_ID === id), fgOf = id => D.fg.find(f => f.FG_ID === id);
const expT = v => v ? new Date(v).getTime() : Infinity;
const lotsOf = rmId => D.rmLots.filter(l => l.RM_ID === rmId && num(l.Qty) > 0).sort((a, b) => (expT(a.ExpDate) - expT(b.ExpDate)) || (expT(a.ReceiveDate) - expT(b.ReceiveDate)) || String(a.Lot_ID).localeCompare(String(b.Lot_ID)));
const fgLotsOf = id => D.fgLots.filter(l => l.FG_ID === id && num(l.Qty) > 0);
const fgReady = id => fgLotsOf(id).filter(l => !(l.ExpDate && l.ExpDate < todayStr())).reduce((s, l) => s + num(l.Qty), 0);
const rmStock = id => (D.bal[id] != null ? D.bal[id] : lotsOf(id).reduce((s, l) => s + num(l.Qty), 0));
function fefoPlan(rmId, qty) { let left = qty; const out = []; for (const l of lotsOf(rmId)) { if (left <= 1e-9) break; const t = Math.min(num(l.Qty), left); out.push({ lot: lotLabel(l), qty: t }); left -= t; } return out; }
// วัตถุดิบ "ชื่อเดียวกัน" คนละรหัส/ซัพ (เหมือน _rmSiblings): หมวดเดียวกัน + ชื่อตรงกัน เรียงสต็อกมาก→น้อย
function siblings(rmId) {

  const nm = (b.RM_Name || '').trim();
  return D.rm.filter(r => r.Category === b.Category && (r.RM_Name || '').trim() === nm).map(r => ({ ...r, _stock: rmStock(r.RM_ID) })).sort((x, y) => y._stock - x._stock);

// ── สแกน: กล้อง (BarcodeDetector → สำรอง html5-qrcode สำหรับ iOS/เบราว์เซอร์ที่ไม่รองรับ) · เครื่องสแกนแบบคีย์บอร์ดพิมพ์ลงช่องค้นหา+Enter ได้เลย ──
function loadScript(src) { return new Promise((res, rej) => { if ($$('script').some(s => s.src === src)) return res(); const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
function scanCode() {
  return new Promise(async resolve => {
    const ov = $('#scanner'), video = $('#scanVideo'), reader = $('#scanReader');
    let stream = null, stopped = false, h5 = null;
    ov.hidden = false; video.hidden = false; reader.hidden = true;
    const finish = v => { if (stopped) return; stopped = true; try { stream && stream.getTracks().forEach(t => t.stop()); } catch (e) {} try { h5 && h5.stop().catch(() => {}); } catch (e) {} video.srcObject = null; ov.hidden = true; resolve(v || null); };
    $('#scanClose').onclick = () => finish(null);
    if ('BarcodeDetector' in window) {
      try {
        const det = new BarcodeDetector();
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
        video.srcObject = stream; await video.play();
        const tick = async () => { if (stopped) return; try { const r = await det.detect(video); if (r.length && r[0].rawValue) { vib(70); return finish(r[0].rawValue); } } catch (e) {} requestAnimationFrame(tick); };
        tick(); return;
      } catch (e) { console.warn('BarcodeDetector path failed', e); try { stream && stream.getTracks().forEach(t => t.stop()); } catch (x) {} }
    }
    try {
      await loadScript('https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js');
      video.hidden = true; reader.hidden = false;
      h5 = new Html5Qrcode('scanReader');
      await h5.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 260, height: 160 } }, txt => { vib(70); finish(txt); }, () => {});
    } catch (e) { console.error(e); toast('เปิดกล้องไม่ได้ — อนุญาตการใช้กล้อง หรือพิมพ์รหัสแทน', 'bad'); finish(null); }
  });
}
// รหัสที่สแกน/พิมพ์ → รายการ (ตรงรหัสวัตถุดิบ/สินค้า ก่อน แล้วค่อยเลข Lot ของเรา)
function resolveCode(code) {
  const c = String(code || '').trim().toLowerCase(); if (!c) return null;
  const rm = D.rm.find(r => String(r.RM_ID).toLowerCase() === c); if (rm) return { kind: 'M', id: rm.RM_ID };
  const fg = D.fg.find(f => String(f.FG_ID).toLowerCase() === c); if (fg) return { kind: 'F', id: fg.FG_ID };
  const lm = D.rmLots.find(l => String(l.Lot || '').toLowerCase() === c || String(l.Lot_ID || '').toLowerCase() === c); if (lm) return { kind: 'M', id: lm.RM_ID, lot: lm.Lot_ID };
  const lf = D.fgLots.find(l => String(l.Lot || '').toLowerCase() === c); if (lf) return { kind: 'F', id: lf.FG_ID, lot: lf.Lot };
  return null;
}

// ── ตัวเลือกรายการ (วัตถุดิบ/แพ็คเกจ/FG) — ค้นหาพิมพ์/สแกน แล้วแตะเลือก ──
let _pickResolve = null;
function itemInfo(kind, id) {
  if (kind === 'F') { const f = fgOf(id); return f ? { kind: 'F', id, name: f.FG_Name, cat: '', unit: f.Unit || '', supplier: '', stock: fgReady(id), min: null } : null; }
  const r = rmOf(id); return r ? { kind: 'M', id, name: r.RM_Name, cat: r.Category || C_FRESH, unit: r.Unit || '', supplier: (r.Supplier || '').replace(/^[-–—.]+$/, ''), stock: rmStock(id), min: r.MinStock } : null;

function allItems(kinds) {

}
function pickItem(opts = {}) {

    const chips = [['', 'ทั้งหมด'], [C_FRESH, 'สด'], [C_DRY, 'แห้ง'], [C_CHEM, 'เคมี'], [C_PREP, 'พร้อมผลิต'], [C_PKG, 'แพ็คเกจ'], ['F', 'FG']].filter(c => !c[0] || (c[0] === 'F' ? kinds.includes('F') : kinds.includes('M')));

      <div class="chips" id="pkChips">${chips.map(([v, l]) => `<button class="chip${v === chip ? ' on' : ''}" data-v="${esc(v)}">${l}</button>`).join('')}</div>
      <div id="pkList"></div>`);
    const draw = () => {

      if (t) list = list.filter(i => [i.id, i.name, i.supplier].join(' ').toLowerCase().includes(t))
        .sort((a, b) => (String(a.id).toLowerCase() === t ? -1 : 0) - (String(b.id).toLowerCase() === t ? -1 : 0));
      $('#pkList', sh).innerHTML = list.slice(0, 60).map(i => `<div class="row-item" data-k="${i.kind}" data-id="${esc(i.id)}">
        <div class="grow"><div class="t">${esc(i.name)}</div><div class="s">${esc(i.id)}${i.supplier ? ' · ' + esc(i.supplier) : ''} · ${i.kind === 'F' ? 'สินค้าสำเร็จรูป' : esc(catName(i.cat))}</div></div>
        <div class="qty-big">${fq(i.stock, i.cat)}<small>${esc(i.unit)}</small></div></div>`).join('') + (list.length > 60 ? `<div class="empty small">แสดง 60 รายการแรก — พิมพ์ค้นหาให้แคบลง</div>` : '') || '<div class="empty">ไม่พบรายการ</div>';

    draw(); setTimeout(() => $('#pkQ', sh).focus(), 150);

}

const lotPrefix = d => (d || todayStr()).slice(2).replace(/-/g, '');
async function nextLot(date, rmId, used = []) {
  const prefix = lotPrefix(date), re = new RegExp(`^${prefix}-(\\d+)$`);
  const { data } = await _sb.from('rm_receive').select('Lot').eq('RM_ID', rmId).like('Lot', `${prefix}-%`);
  const all = [...(data || []).map(r => r.Lot), ...used];
  const max = Math.max(0, ...all.map(l => (String(l || '').match(re) || [])[1]).filter(Boolean).map(Number));
  return `${prefix}-${String(max + 1).padStart(2, '0')}`;

          return `<div class="row-item" onclick="go('fgForm',{co:'${esc(x.c.Order_ID)}'})"><div class="grow"><div class="t">${esc(x.c.Order_ID)} · ${esc(x.c.CustomerName)}</div>
            <div class="s">${esc(x.fg?.FG_Name || x.c.FG_ID)}${x.c.PO_No ? ' · PO ' + esc(x.c.PO_No) : ''}${x.c.NeedDate ? ' · กำหนดส่ง ' + fmtDate(x.c.NeedDate) : ''}</div>
            <div style="margin-top:4px">${ready >= x.remain ? '<span class="pill ok">พร้อมส่งครบ</span>' : ready > 0 ? `<span class="pill warn">สต็อกขาด ${fq(x.remain - ready)}</span>` : '<span class="pill bad">ไม่มีสต็อก</span>'}</div></div>
            <div class="qty-big">${fq(x.remain)}<small>ค้างส่ง ${esc(x.fg?.Unit || '')}</small></div></div>`; }).join('') || '<div class="empty">ไม่มี CO ที่ค้างส่ง</div>';
      };
      $('#foQ', v).oninput = e => { FO.q = e.target.value; draw(); }; draw();
    } else {
      const order = { 'รอจัดส่ง': 0, 'จัดส่งแล้ว': 1 };
      body.innerHTML = D.dlv.slice().sort((a, b) => (order[a.Status] ?? 9) - (order[b.Status] ?? 9)).map(d => {
        const co = D.cos.find(c => c.Order_ID === d.Order_ID) || {}, fg = fgOf(co.FG_ID);
        const next = d.Status === 'รอจัดส่ง' ? ['จัดส่งแล้ว', 'btn-primary', 'fa-truck', 'ส่งออกแล้ว'] : ['ส่งถึงแล้ว', 'btn-ok', 'fa-circle-check', 'ส่งถึงลูกค้าแล้ว'];
        return `<div class="card"><div class="bold">${esc(d.Delivery_ID)}</div><div class="muted small">CO ${esc(d.Order_ID || '-')} · ${esc(co.CustomerName || '')}</div>
          <div style="margin:6px 0">${esc(fg?.FG_Name || co.FG_ID || '')} — <b>${fq(d.QtyDelivered)}</b> ${esc(fg?.Unit || '')} <span class="pill ${d.Status === 'รอจัดส่ง' ? '' : 'info'}">${esc(d.Status)}</span></div>
          <button class="btn ${next[1]}" style="width:100%" data-id="${esc(d.Delivery_ID)}" data-s="${next[0]}" onclick="advanceDelivery(this)"><i class="fa-solid ${next[2]}"></i> ${next[3]}</button></div>`;
      }).join('') || '<div class="empty">ไม่มีรายการจัดส่งที่ค้างอยู่</div>';
    }
  },
};
async function advanceDelivery(btn) {
  const id = btn.dataset.id, st = btn.dataset.s;
  const c = await Swal.fire({ title: `${st === 'จัดส่งแล้ว' ? 'ยืนยันส่งออก' : 'ยืนยันส่งถึงลูกค้าแล้ว'}?`, text: id, showCancelButton: true, confirmButtonText: 'ยืนยัน', cancelButtonText: 'ยกเลิก' });
  if (!c.isConfirmed) return;
  btn.disabled = true;
  const patch = { Status: st }; if (st === 'ส่งถึงแล้ว') patch.DeliveryDate = todayStr();
  const { data, error } = await _sb.from('delivery').update(patch).eq('Delivery_ID', id).select();
  if (error || !data?.length) { btn.disabled = false; Swal.fire('อัปเดตสถานะไม่สำเร็จ', esc(error?.message || 'ไม่พบรายการ'), 'error'); return; }
  if (st === 'ส่งถึงแล้ว' && data[0].Order_ID) {   // กฎเดียวกับ deliveryAdvance ของ desktop: ส่งถึงสะสมครบยอดสั่ง → ปิด CO
    const { data: all } = await _sb.from('delivery').select('QtyDelivered').eq('Order_ID', data[0].Order_ID).eq('Status', 'ส่งถึงแล้ว');
    const sum = (all || []).reduce((s, x) => s + num(x.QtyDelivered), 0), co = D.cos.find(c => c.Order_ID === data[0].Order_ID);
    if (co && sum >= num(co.OrderQty)) await _sb.from('customer_orders').update({ Status: 'ส่งสำเร็จ', CompletedAt: new Date().toISOString() }).eq('Order_ID', data[0].Order_ID);
  }
  vib(60); await loadData(); render(); toast('อัปเดตสถานะจัดส่งแล้ว', 'ok');
}
// ── เบิก FG ตาม CO หลายล็อต เรียง FIFO (ผลิตก่อนเบิกก่อน) — fg_withdraw_for_co ธุรกรรมเดียว ──
let FW = null;
const fifo = (a, b) => { const m = s => String(s.MfgDate || s.ExpDate || '9999-12-31'), e = s => String(s.ExpDate || '9999-12-31'); return m(a).localeCompare(m(b)) || e(a).localeCompare(e(b)) || String(a.Lot).localeCompare(String(b.Lot), undefined, { numeric: true }); };
const lotExpired = l => !!l.ExpDate && String(l.ExpDate) < todayStr();
SCREENS.fgForm = {
  title: p => `เบิก ${p.co}`,
  render(p, v) {
    const co = D.cos.find(c => c.Order_ID === p.co); if (!co) { v.innerHTML = '<div class="empty">ไม่พบ CO</div>'; return; }
    const fg = fgOf(co.FG_ID), remain = Math.max(0, num(co.OrderQty) - (D.wd[co.Order_ID] || 0)), lots = fgLotsOf(co.FG_ID).sort(fifo);
    if (!lots.length) { v.innerHTML = '<div class="empty">สินค้านี้ไม่มีสต็อกคงเหลือให้เบิก</div>'; return; }
    const ready = lots.filter(l => !lotExpired(l)).reduce((s, l) => s + num(l.Qty), 0);
    FW = { co, lots, remain, qty: lots.map(() => 0) };
    v.innerHTML = `<div class="formwrap"><div class="card"><div class="bold">${esc(co.CustomerName)}${co.PO_No ? ' · PO ' + esc(co.PO_No) : ''}</div><div class="muted small">${esc(fg?.FG_Name || co.FG_ID)} · ค้างส่ง ${fq(remain)} ${esc(fg?.Unit || '')} · พร้อมส่งรวม ${fq(ready)}</div></div>
      <div class="fld"><label>จำนวนที่เบิกรวม <span class="req">*</span></label><div class="in-group"><input class="in" id="fwTotal" type="number" inputmode="decimal" step="any" min="0"><span class="unit">${esc(fg?.Unit || '')}</span></div>
        <div class="muted small" style="margin-top:4px">ระบบจัดล็อตให้ตาม <b>FIFO</b> (ผลิตก่อนเบิกก่อน) ให้ครบ — แก้จำนวนรายล็อตเองได้</div></div>
      <div id="fwLots"></div><div class="small" id="fwSum" style="margin-top:6px"></div><div class="err" id="fwErr"></div></div>`;
    $('#fwLots').innerHTML = lots.map((l, k) => `<div class="lotrow" style="${lotExpired(l) ? 'background:#fff1f2' : ''}"><div class="grow"><div class="bold">${esc(l.Lot)}${lotExpired(l) ? ' <span class="pill bad">หมดอายุแล้ว</span>' : ''}</div>
      <div class="muted small">${l.MfgDate ? 'ผลิต ' + fmtDate(l.MfgDate) + ' · ' : ''}${l.ExpDate ? 'หมดอายุ ' + fmtDate(l.ExpDate) + ' · ' : ''}เหลือ ${fq(l.Qty)}</div></div>
      <input class="in fw-q" type="number" inputmode="decimal" step="any" min="0" data-k="${k}" oninput="fwSum()"></div>`).join('');
    $('#fwTotal').oninput = fwAlloc;
    $('#fwTotal').value = Math.min(remain, ready) || ''; fwAlloc();
    setActions('<button class="btn btn-ok" id="fwSave" onclick="saveFg()"><i class="fa-solid fa-truck"></i> ยืนยันเบิก</button>');
  },
};
function fwAlloc() {
  let left = num($('#fwTotal').value);
  $$('#fwLots .fw-q').forEach(inp => { const l = FW.lots[+inp.dataset.k], take = lotExpired(l) ? 0 : Math.min(num(l.Qty), left); inp.value = take > 0 ? r3(take) : ''; left = r3(left - take); });
  fwSum(left > 0 ? left : 0, true);
}
function fwSum(short, fromTotal) {
  const ins = $$('#fwLots .fw-q'), sum = r3(ins.reduce((s, i) => s + num(i.value), 0));
  if (!fromTotal) $('#fwTotal').value = sum || '';
  ins.forEach(i => i.classList.toggle('bad', num(i.value) > num(FW.lots[+i.dataset.k].Qty) + 1e-9));
  let m = `เบิกรวม <b>${fq(sum)}</b> จาก ${ins.filter(i => num(i.value) > 0).length} ล็อต · ค้างส่ง ${fq(FW.remain)}`;
  if (short > 0) m += ` · <span style="color:var(--bad);font-weight:700">สต็อกพร้อมส่งไม่พอ ขาด ${fq(short)}</span>`;
  else if (sum > FW.remain + 1e-9) m += ` · <span style="color:var(--warn);font-weight:700">เกินยอดค้างส่ง ${fq(sum - FW.remain)}</span>`;
  else if (sum > 0 && Math.abs(sum - FW.remain) < 1e-9) m += ' · <span style="color:var(--ok);font-weight:700">ครบยอดค้างส่ง</span>';
  $('#fwSum').innerHTML = m;
}
async function saveFg() {
  $('#fwErr').textContent = '';
  const items = [];
  for (const inp of $$('#fwLots .fw-q')) {
    const qty = num(inp.value), l = FW.lots[+inp.dataset.k]; if (qty <= 0) continue;
    if (qty > num(l.Qty) + 1e-9) { $('#fwErr').textContent = `ล็อต ${l.Lot} เบิกเกินสต็อก (เหลือ ${fq(l.Qty)})`; inp.focus(); return; }
    items.push({ lot: l.Lot, qty, expired: lotExpired(l) });
  }
  if (!items.length) { $('#fwErr').textContent = 'กรอกจำนวนที่เบิกอย่างน้อย 1 ล็อต'; return; }
  const total = items.reduce((s, i) => s + i.qty, 0), warns = [];
  if (total > FW.remain + 1e-9) warns.push(`เบิกรวม ${fq(total)} <b>เกินยอดค้างส่ง</b> ${fq(FW.remain)}`);
  if (items.some(i => i.expired)) warns.push('มีล็อตที่ <b>หมดอายุแล้ว</b> ในรายการเบิก');
  if (warns.length) { const c = await Swal.fire({ icon: 'warning', title: 'ตรวจสอบก่อนเบิก', html: `<div class="small" style="text-align:left">${warns.map(w => '• ' + w).join('<br>')}</div>`, showCancelButton: true, confirmButtonText: 'เบิกต่อ', cancelButtonText: 'กลับไปแก้' }); if (!c.isConfirmed) return; }
  setBusy('fwSave', true);
  const { error } = await _sb.rpc('fg_withdraw_for_co', { p_order_id: FW.co.Order_ID, p_items: items.map(i => ({ lot: i.lot, qty: i.qty })) });
  setBusy('fwSave', false);
  if (error) { rpcErr(error, 'บันทึกการเบิกไม่สำเร็จ (ไม่ได้ตัดสต็อกเลย)', 'migration_2026-10-17_fg_withdraw_multilot.sql'); return; }
  vib(100); await loadData(); stack.pop(); render();
  toast(`เบิก ${fq(total)} จาก ${items.length} ล็อตแล้ว — ไปแท็บ "จัดส่ง" เพื่อยืนยันส่งออก`, 'ok');
}

// ── เริ่มต้น ──
onNet();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
// ถ้ามี session อยู่แล้ว onAuthStateChange จะเรียกเอง ไม่งั้นแสดงหน้า login
setTimeout(() => { if (!_started && $('#app').hidden) $('#login').hidden = false; }, 800);
</script>
